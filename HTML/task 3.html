<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product-card{
            border:5px solid black;
            text-align: center;
            max-width: 300px;
            max-height:200px;
            background-color: brown;
            margin: 20px;
            padding:10px;
            border-radius: 20px;
            box-sizing: 10px;

            
        }

        h1{
            color:bisque;
            
        }

        button{
            color:black;
            background-color: aquamarine;
            padding:3px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover{
            background-color: antiquewhite;
        }
    </style>

</head>
<body>
    <div class="product-card">
    <h1>Laptop</h1>
    <p>Get the New Speed Pro Laptop Today!</p>
    <h2>$ 50000</h2>
    <button>Buy Now</button>
    </div>

    <div class="product-card">
    <h1>Smart Phone</h1>
    <p>Get the New Speed Pro Smart phone Today!</p>
    <h2>$ 40000</h2>
    <button>Buy Now</button>
    </div>

    <div class="product-card">
    <h1>Ipad</h1>
    <p>Get the New Speed Pro Ipad Today!</p>
    <h2>$ 10000</h2>
    <button>Buy Now</button>
    </div>



</body>
</html>
