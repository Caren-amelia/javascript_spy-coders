<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1> 
            Application Form
        </h1>
    </form> <br> <br>
    
    <label for="First Name">First Name:</label>
    <input type="text" name="First Name">

    <label for="Last Name">Last Name:</label>
    <input type="text" name="Last Name">  <br> <br>

    <label for="DOB">Date of Birth:</label>
    <input type="date" name="DOB"> 

    <label for="Age">Age:</label>
    <input type="number" name="Age" > <br> <br>

    <label for="Gender">Gender:</label>

    <select name="Gender">

        <option value="Male">MALE</option>
        <option value="female">FEMALE</option>
        <option value="other">OTHER</option>

    </select>

    <label for="email">Email Address:</label>
    <input type="email" name="email" id="email" placeholder="Enter email address"> <br><br>

    <label for="Radio">Positions Available:</label>
    <input type="radio" name="positions" value="junior developer" id="junior developer">
    <label for="junior developer">junior developer</label>
    
    <input type="radio" name="positions" value="Mid-level developer" id="mid-level developer">
    <label for="Mid-level develope">Mid-level developer</label>
    
    <input type="radio" name="positions" value=" Senior developer" id=" Senior developer">
    <label for="Senior developer">Senior developer</label> <br><br>

    <label for="Programming Language">Programming Language:</label>
    <input type="checkbox" name="programming" value="java" id="java">
    <label for="java">Java</label>
    
    <input type="checkbox" name="programming" value="javascript" id="javascript">
    <label for="javascript">JavaScript</label>
    
    <input type="checkbox" name="programming" value="python" id="python">
    <label for="python">Python</label> <br><br>

    <label for="password">Password:</label>
    <input type="password" name="password">
    <label for="password">Confirm Password:</label>
    <input type="password" name="password"> <br><br>

    <button>Submit</button>
    <button type="reset">Reset</button>





    




  


  





</body>
</html>
