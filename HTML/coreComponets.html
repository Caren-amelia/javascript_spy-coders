<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    Tags:
    1. <html> - Contains the entire html document 
        Element type -  Root type
        Attributes - lang

    2. <head> - Contains webpage information(title,CSS,JS)
        Element type - Head type
        Attributes -  None

    3. <title> - sets the browse tab title 
        Element type - Block level element
        Attribute - None
    
    4. <body> - Contains visible webpage content
        Element type - Block-level element 
        Attribute - None

    5. <h1> - Main heading
        Element Type - Block-level element
        Attribute - None

    6. <p> - Paragraph
        Element type - Block level element
        Attribute - None

    7. <div> - Groups HTML elements.
        Element Type - Block level element
        Attribute - None

    8. <span> - Groups small portion of text.
        Element type - Inline
        Attribute - None

    9. <a> - Creates a hyperlink 
        Element type - Inline
        Attribute - href,target,download

    10. <img> - Displays an image.
        Element type - Inline
        Attribute - src,alt,width,height

    11. <br> - Inserts a break line.
        Element type - Inline
        Attribute - None

    12. <hr> - Inserts a horizontal line.
        Element type - Block level 
        Attribute - None
    
    13. <ul> - Creats a bulleted list.
        Element type - Block level element
        Attribute - None

    14. <ol> - Creates a numbered list.
        Element type - Block level element
        Attribute - None

    15. <li> - Define a list item
        Element type - Block level element
        Attribute - None

    16. <table> - Displays data in rows and columns.
        Element type - Block level element
        Attribute - None

    17. <tr> - Defines a table row.
        Element type - Block level element
        Attribute - None

    18. <th> - Define a table data cell.
        Element type - Block level element
        Attribute - colspan,rowspan

    19. <td> - Define a table data cell.
        Element type - Block level element
        Attribute - colspan,rowspan

    20. <form> - Creates a form.
        Element type - Block level element
        Attribute - action,method,autocomplete

    21. <input> - Creates an input field.
        Element type - Inline element
        Attribute - type,name,value,required,placeholder,readonly

    22. <label> - Defines a label for an input.
        Element type - Inline element
        Attribute - for

    23. <button> - Creates a clickable button.
        Element type - Inline element
        Attribute - type,disabled

    24. <textarea> - Creates multi-line text box.
        Element type - Inlin element
        Attribute - rows,cols,placeholder

    25. <select> - Creates a drop-down list 
        Element type - Inline element
        Attribute - name,multiple

    26. <option> - Defines an option in a drop down list.
        Element type - Inline element
        Attribute - value,selected

    27. <header> - defines the header section.
        Element type - Block level element
        Attribute - None

    28. <nav> -Defines the navigation section.
        Element type - Block level element
        Attribute - None

    29. <main> - Defines the main content.
        Element type - Block level element
        Attribute - None

    30. <section> - Defines a section relates content.
        Element type - Block level element
        Attribute - None

    31. <article> - Defines independent content.
        Element type - Block level element
        Attribute - None

    32. <aside> - Defines sidebar or related content.
        Element type - Block level element
        Attribute - None

    33. <footer> - Defines a footer section
        Element type - Block level element
        Attribute - None
    
    
    
    
    
    
    
    
    
    -->
</body>
</html>
