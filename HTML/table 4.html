<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        th,td{
            border: 1px solid black;
            padding:20px;
    

        }
    </style>
</head>
<body>
    <table style="border: 1px solid black; width:50px; height:200px; background-color:white; margin:auto; text-align: center; padding:0px;">
        <tr>
            <th style="background-color: yellow;">1</th>
            <th colspan="2" style="background-color: yellow;">2</th>
            <th colspan="2" style="background-color: yellow;">3</th>
            <!--<th></th>
            <th></th>-->
        </tr>

        <tr>
            <td rowspan="2" colspan="2" style="background-color:lightblue;">4</td>
            <td colspan="3" style="background-color:lightblue;">5</td>
            <!--<td></td>
            <td></td>
            <td></td>-->
        </tr>

        <tr>
            <td colspan="2" style="background-color:lightgreen;">6</td>
            <td rowspan="3" style="background-color:lightgreen;">7</td>
            <!--<td></td>
            <td></td>
            <td></td>-->
        </tr>

        <tr>
            <td rowspan="5" style="background-color: beige;">8</td>
            <td style="background-color:beige;">9</td>
            <td style="background-color: beige;">10</td>
            <td rowspan="2" style="background-color:beige;">11</td>
            <!--<td></td>-->
        </tr>

        <tr>
            <td colspan="2" style="background-color: lightcoral">12</td>
            <!--<td></td>
            <td></td>
            <td></td>
            <td></td>-->
        </tr>

        <tr>
            <td rowspan="3" style="background-color:lightpink;">13</td>
            <td colspan="3" style="background-color: lightpink">14</td>
            <!--<td></td>
            <td></td>
            <td></td>-->
        </tr>

        <tr>
            <td colspan="2" style="background-color:orangered;">15</td>
            <td style="background-color: orangered">16</td>
            <!--<td></td>
            <td></td>
            <td></td>-->
        </tr>

        <tr>
            <td colspan="3" style="background-color: yellow;">17</td>
            <!--<td></td>
            <td></td>
            <td></td>
            <td></td>-->
        </tr>

    </table>
</body>
</html>
