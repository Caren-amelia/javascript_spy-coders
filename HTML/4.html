<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2>All Form Types Demo</h2>

        <label for="text">Text:</label>
        <input type="text" name="text" id="text" placeholder="Your name"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Secret"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>

        <label for="Url">URL:</label>
        <input type="url" id="url" name="url" placeholder="https://example.com"><br><br>

        <label for="telephone">Telephone:</label>
        <input type="tel" id="telephone" name="tel" patten="[0-9]{10}" placeholder="+91 9237487574"><br><br>

        <label for="search">Search:</label>
        <input type="text" id="search" name="text" placeholder="search item"><br><br>

        <label for="number">Number:</label>
        <input type="number" id="number" name="number"><br><br>

        <label for="Range">Range:</label>
        <input type="range" id="range" name="range"><br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">

        <label for="time">Time:</label>
        <input type="Time" id="Time" name="Time">

        <label for="week">Week:</label>
        <input type="week" id="week" name="week">

        <label for="month">Month:</label>
        <input type="month" id="month" name="month"><br><br>

        <label for="color">Color:</label>
        <input type="color" id="color" name="color" value="lightblue"><br><br>

        <input type="checkbox" name="terms" value="agree">I agree to the term<br>

        <input type="checkbox" name="newsletter" value="Subscribe">Subscribe to newsletter<br><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" name="choice">
        <label for="gender">Male</label><br>

        <input type="radio" name="choice">
        <label for="gender">Female</label><br>

        <input type="radio" name="choice">
        <label for="gender">Other</label><br><br>

        <label for="country">Country (single select):</label>
    

        <select name="country">
            <option value="--choose--">--choose--</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="Uk">Uk</option>
            <option value="korea">korea</option>


    </select><br><br>

    <label for="message">Message:</label>
    <textarea rows="5" cols="30" placeholder="Write something..."></textarea><br><br>

    <button>Submit form</button>
    <button type="reset">Reset Form</button>









    








        





        
    </form>
</body>
</html>
