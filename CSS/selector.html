<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p { 
            color:brown;

        }

        .course{
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: lightskyblue;

        }

        #main{
            color:goldenrod;
        }

        *{
            margin:5px;
            padding:5px;
        }

        input[name="username"]{
            background-color: lightblue;
        }

        input[name="password"]{
            background-color: lightblue;

        }

        input[name="email"]{
            background-color: lightblue;

        }
        
        h1,h2{
            color:lightseagreen
        }
        
        </style>
</head>
<body>
    <h1>Student Portal</h1>
    <p id="main">Learning Python and Java gives students powerful coding skills to build websites, apps, and smart software</p>

    <h3 class="course">Python</h3>
    <p>Python uses simple English-like words, so beginners can learn to code fast.</p>
    <h3 class="course">Java</h3>
    <p>Java teaches strong structural programming and clean code habits.</p><br>
   
    <h2>Student Form:</h2>

    <label for="username">Username:</label>
    <input type="text" name="username"><br><br>

    <label for="email">Email:</label>
    <input type="text" name="email"><br><br>

    <label for="password">Password:</label>
    <input type="password" name="password"><br><br>

    <button>Login</button>
    <button type="reset">Reset</button>


</body>
</html>
